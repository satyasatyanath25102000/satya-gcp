apiVersion: apps/v1
kind: Deployment

metadata:
  name: inference-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inference-api

  template:
    metadata:
      labels:
        app: inference-api

    spec:
      containers:
        - name: inference-api
          image: inference-api

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
